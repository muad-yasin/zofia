[package]
name = "zofia"
version = "0.1.0"
description = "Zofia - a Linux C&C overview of several Claude Code terminal sessions"
authors = ["Sower Industries"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "zofia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.4"
portable-pty = "0.9"
sha2 = "0.10"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
